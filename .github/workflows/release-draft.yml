# Release draft — tag-triggered (v*). The draft is the visible to-do after a
# tag push; npm publishing waits for the release to be PUBLISHED (see
# npm-publish.yml and ADR-0007).

name: release draft

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    name: create draft release
    runs-on: ubuntu-latest
    steps:
      # --generate-notes diffs against the previous published release by
      # default — exactly the baseline we want; no checkout needed. The repo
      # must be explicit: without a checkout there is no git context for gh
      # to resolve it from (first v* tag run failed with "not a git
      # repository" — v0.9.0's draft was created manually as a one-off).
      - name: Create draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --draft --title "$TAG" --generate-notes --repo "$REPO"
