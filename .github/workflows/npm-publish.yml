# npm publish — tag-triggered (v*), gated on the full CI lane.
#
# Authenticates via npm Trusted Publishing (GitHub OIDC): no NPM_TOKEN secret.
# Requires the trusted-publisher entry on npmjs.com:
#   repository: No-World/pi-asterisk-tui · workflow: npm-publish.yml · environment: (none)
# Needs npm >= 11.5 (bundled with current Node 24.x).

name: npm publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish (trusted publishing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Gate — npm test + typecheck
        run: |
          npm test
          npm run typecheck
      - name: Publish
        run: npm publish --provenance --access public
