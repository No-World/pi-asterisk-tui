# npm publish — gated on the GitHub Release being PUBLISHED (ADR-0007).
#
# The tag push itself only creates a draft release (release-draft.yml);
# publishing that release — with its notes — is what triggers this workflow.
# The workflow FILENAME is load-bearing: npmjs trusted publishing pins it
# (repository: No-World/pi-asterisk-tui · workflow: npm-publish.yml).
#
# Authenticates via npm Trusted Publishing (GitHub OIDC): no NPM_TOKEN secret.
# Needs npm >= 11.5 (bundled with current Node 24.x).

name: npm publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish (trusted publishing)
    runs-on: ubuntu-latest
    # Non-version releases never publish.
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Gate — tag matches package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::release tag $TAG does not match package.json $VERSION — wrong tag or wrong branch?"
            exit 1
          fi
      - name: Gate — npm test + typecheck
        run: |
          npm test
          npm run typecheck
      - name: Publish
        run: npm publish --provenance --access public
